<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<link
			href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@900&family=Zen+Kaku+Gothic+New:wght@400&family=IBM+Plex+Mono:wght@400&display=block"
			rel="stylesheet"
		/>
		<style>
			/* linkeun.com share card: kon ground, kumiko lattice in one corner, wordmark on a planed rule */
			* {
				margin: 0;
				box-sizing: border-box;
			}
			body {
				--bar: #e6e0d21f;
				--frame: #e6e0d233;
				width: 1200px;
				height: 630px;
				overflow: hidden;
				position: relative;
				background: #131b2c;
				color: #e6e0d2;
				font-family: 'Zen Kaku Gothic New', sans-serif;
				padding: 120px 112px;
			}
			.lattice {
				position: absolute;
				right: 0;
				bottom: 0;
				width: 640px;
				height: 630px;
				background-image:
					linear-gradient(var(--frame) 2px, transparent 2px),
					linear-gradient(90deg, var(--frame) 2px, transparent 2px),
					linear-gradient(var(--bar) 1px, transparent 1px),
					linear-gradient(90deg, var(--bar) 1px, transparent 1px);
				background-size:
					168px 252px,
					168px 252px,
					42px 63px,
					42px 63px;
				background-position: right bottom;
				mask-image: radial-gradient(ellipse at 100% 100%, #000 25%, transparent 72%);
			}
			h1 {
				position: relative;
				font-family: 'Zen Old Mincho', serif;
				font-weight: 900;
				font-size: 104px;
				line-height: 1;
				letter-spacing: 0.12em;
			}
			.rule {
				width: 168px;
				height: 3px;
				margin-top: 40px;
				background: #e6e0d2;
			}
			p {
				position: relative;
				margin-top: 40px;
				font-size: 34px;
				line-height: 1.5;
				max-width: 18em;
			}
			.foot {
				position: absolute;
				left: 112px;
				bottom: 96px;
				font-family: 'IBM Plex Mono', monospace;
				font-size: 24px;
				color: #9a9a9a;
			}
			.seal {
				position: absolute;
				right: 112px;
				bottom: 88px;
				padding: 10px 18px;
				border: 2px solid #e35d44;
				color: #e35d44;
				font-family: 'IBM Plex Mono', monospace;
				font-size: 22px;
				transform: rotate(-4deg);
				background: #131b2c;
			}
		</style>
	</head>
	<body>
		<div class="lattice"></div>
		<h1>Linkeun Mono</h1>
		<div class="rule"></div>
		<p>A small studio in Indonesia that builds quiet tools for the web.</p>
		<span class="foot">lkmn.link · Newda</span>
		<span class="seal">www.linkeun.com</span>
	</body>
</html>
