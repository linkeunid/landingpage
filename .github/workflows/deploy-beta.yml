name: Deploy beta

# Every push to main: check, test, build, wrangler deploy --env beta (Worker landingpage-beta at beta.linkeun.com).
on:
  push:
    branches: [main]
    # Docs-only pushes change nothing that runs; skip the deploy (run it by hand if needed).
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-beta
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: beta
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Browser specs (client project) need Chromium; skipped to save Actions minutes. Restore both lines below to run them.
      # - run: pnpm exec playwright install --with-deps chromium
      # Gitignored, generated before pnpm check: worker-configuration.d.ts
      # and src/lib/paraglide (vite plugin only compiles it on dev/build).
      - run: pnpm gen
      - run: pnpm exec paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide --emit-ts-declarations
      - run: pnpm check
      # - run: pnpm test
      - run: pnpm test --project server

      - run: pnpm run deploy:beta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: false
